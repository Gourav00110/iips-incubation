spring.application.name=iips-incubation
server.port=8080

# ---- Default: H2 file database (works out of the box) ----
spring.datasource.url=jdbc:h2:file:./data/iipsdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ---- To use MySQL instead, comment the H2 lines above and uncomment: ----
# spring.datasource.url=jdbc:mysql://localhost:3306/iips_incubation?createDatabaseIfNotExist=true
# spring.datasource.username=root
# spring.datasource.password=your_password
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
